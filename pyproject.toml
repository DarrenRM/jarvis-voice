[project]
name = "discord-voice-claude-bot"
version = "0.1.0"
description = "Voice-activated AI assistant for Discord"
requires-python = ">=3.11"
dependencies = [
    # Discord. Pinned to the releases src/bot/pycord_dave_patch.py was written against
    # (its PATCHED_VERSIONS): Discord requires DAVE, and 2.8's receive path needs the patch.
    "py-cord[voice]>=2.8.0,<2.8.2",
    "davey>=0.1.4,<1",  # DAVE decryption; the patch imports it directly

    # Audio Processing
    "numpy>=1.24.0",
    "pydub>=0.25.0",
    "scipy>=1.12.0",  # Audio resampling for Discord format conversion

    # STT (Groq Whisper)
    "groq>=0.4.0",

    # VAD + wake word (CPU inference is plenty for these small models)
    "onnxruntime>=1.17.0",
    "silero-vad>=5.1",
    "torch>=1.12.0",  # Silero runs on it; vad.py and speaking_detector.py import it directly
    "openwakeword>=0.6.0",

    # TTS (Inworld API)
    "aiohttp>=3.9.0",
    "num2words>=0.5.13",  # Number to words for better TTS pronunciation

    # LLM (Cerebras via its OpenAI-compatible API)
    "openai>=1.40.0",

    # Web lookup: DuckDuckGo search + local page extraction
    "ddgs>=9.0.0",
    "httpx>=0.27.0",
    "trafilatura>=2.0.0",

    # Image Generation (Nano Banana / Gemini) - disabled by default
    "google-genai>=1.0.0",

    # Configuration
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]

[project.scripts]
claude-bot = "src.main:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
