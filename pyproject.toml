[project]
name = "discord-voice-claude-bot"
version = "0.1.0"
description = "Voice-activated AI assistant for Discord using Claude Code"
requires-python = ">=3.10"
dependencies = [
    # Discord
    "py-cord[voice]>=2.6.0",

    # Audio Processing
    "numpy>=1.24.0",
    "soundfile>=0.12.0",
    "sounddevice>=0.4.6",
    "pydub>=0.25.0",
    "scipy>=1.12.0",  # Audio resampling for Discord format conversion

    # STT (Speech-to-Text) - Groq Whisper (primary) or Deepgram Flux / Whisper (fallback)
    "groq>=0.4.0",
    "deepgram-sdk>=5.3.0",
    # Keep faster-whisper as fallback for offline use
    "faster-whisper>=1.0.0",

    # VAD (Voice Activity Detection) - for wake word, Flux handles turn detection
    "onnxruntime-gpu>=1.17.0",
    "silero-vad>=5.1",

    # Wake Word Detection
    "openwakeword>=0.6.0",

    # TTS (Inworld API)
    "aiohttp>=3.9.0",

    # Claude Code SDK (headless mode - no API key needed)
    "claude-code-sdk>=0.0.20",

    # Search Pipeline (for Groq LLM tool use)
    "ddgs>=7.0.0",

    # Image Generation (Nano Banana / Gemini)
    "google-genai>=1.0.0",

    # Configuration
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",

    # Logging
    "structlog>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]

[project.scripts]
claude-bot = "src.main:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
