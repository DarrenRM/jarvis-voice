# Firecrawl Self-Hosted Setup (using pre-built GHCR images)
#
# Start: docker compose -f docker-compose.firecrawl.yml up -d
# Stop:  docker compose -f docker-compose.firecrawl.yml down
# Logs:  docker compose -f docker-compose.firecrawl.yml logs -f
#
# Firecrawl is OPTIONAL - DuckDuckGo search works without it.
# Firecrawl adds full page content extraction from URLs.
#
# API endpoint: http://localhost:3002
# Queue admin:  http://localhost:3002/admin/@/queues (key: firecrawl)

name: firecrawl

services:
  playwright-service:
    image: ghcr.io/firecrawl/playwright-service:latest
    environment:
      PORT: 3000
    networks:
      - backend
    restart: unless-stopped

  api:
    image: ghcr.io/firecrawl/firecrawl:latest
    environment:
      HOST: "0.0.0.0"
      PORT: 3002
      REDIS_URL: redis://redis:6379
      REDIS_RATE_LIMIT_URL: redis://redis:6379
      PLAYWRIGHT_MICROSERVICE_URL: http://playwright-service:3000/scrape
      USE_DB_AUTHENTICATION: "false"
      NUM_WORKERS_PER_QUEUE: 2
      BULL_AUTH_KEY: firecrawl
      # LLM for extract feature (using Groq's OpenAI-compatible API)
      OPENAI_API_KEY: ${GROQ_API_KEY}
      OPENAI_BASE_URL: https://api.groq.com/openai/v1
      MODEL_NAME: openai/gpt-oss-20b
      # PostgreSQL config (must use 'postgres' db for pg_cron compatibility)
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      NUQ_DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
      NUQ_RABBITMQ_URL: amqp://rabbitmq:5672
    depends_on:
      - redis
      - playwright-service
      - postgres
      - rabbitmq
    ports:
      - "3002:3002"
    networks:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks:
      - backend
    command: redis-server --bind 0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    build: firecrawl-repo/apps/nuq-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    networks:
      - backend
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-alpine
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
